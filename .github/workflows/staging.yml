name: staging

on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - run: echo "merge detected on staging (${{ github.sha }})"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0, OIDC, no stored keys
        with:
          role-to-assume: ${{ vars.STAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws sts get-caller-identity
